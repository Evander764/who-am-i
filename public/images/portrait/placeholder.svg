      <stop offset="0%" stop-color="#F2EBD9"/>
      <stop offset="60%" stop-color="#E8DFC8"/>
      <stop offset="100%" stop-color="#C9BFA8"/>
    </radialGradient>
    <pattern id="grain" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
