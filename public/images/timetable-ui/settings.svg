<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050714"/>
      <stop offset="1" stop-color="#02040b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg4)"/>

  <text x="80" y="62" font-size="12" letter-spacing="0.28em" fill="rgba(127,230,255,0.7)">[ TIMETABLE / SETTINGS ]</text>
  <text x="80" y="130" font-size="42" letter-spacing="-0.02em" fill="#F6F2E8">设置</text>
  <text x="80" y="166" font-size="14" letter-spacing="0.1em" fill="rgba(246,242,232,0.55)">9 模块 · 5 桌面 Widget · 4 仪式动画</text>

  <!-- left nav -->
  <g>
    <line x1="80" y1="220" x2="280" y2="220" stroke="#D6A957" stroke-width="1.5" opacity="0.6"/>
    <text x="80" y="262" font-size="11" letter-spacing="0.3em" fill="rgba(127,230,255,0.7)">[ NAV ]</text>
    <g font-size="14" letter-spacing="0.02em">
      <text x="80" y="318" fill="#D6A957">▸ 桌面 Widget</text>
      <text x="80" y="358" fill="rgba(246,242,232,0.6)">  仪式动画</text>
      <text x="80" y="398" fill="rgba(246,242,232,0.6)">  课程时间</text>
      <text x="80" y="438" fill="rgba(246,242,232,0.6)">  通知与提醒</text>
      <text x="80" y="478" fill="rgba(246,242,232,0.6)">  备份与恢复</text>
      <text x="80" y="518" fill="rgba(246,242,232,0.6)">  时间审计</text>
      <text x="80" y="558" fill="rgba(246,242,232,0.6)">  外观与色板</text>
      <text x="80" y="598" fill="rgba(246,242,232,0.6)">  快捷键</text>
      <text x="80" y="638" fill="rgba(246,242,232,0.6)">  开机自启</text>
      <text x="80" y="678" fill="rgba(246,242,232,0.6)">  关于</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="340" y1="220" x2="340" y2="900" stroke="rgba(127,230,255,0.1)" stroke-width="1"/>

  <!-- main panel: 桌面 Widget -->
  <text x="400" y="260" font-size="22" letter-spacing="0.01em" fill="#F6F2E8">桌面 Widget</text>
  <text x="400" y="290" font-size="12" letter-spacing="0.1em" fill="rgba(246,242,232,0.55)">5 个可挂上桌面的小卡片，独立窗口 · 始终置顶 · 贴边自动隐藏</text>
  <line x1="400" y1="312" x2="600" y2="312" stroke="#D6A957" stroke-width="1.5"/>

  <!-- toggles -->
  <g font-size="15" letter-spacing="0.02em">
    <!-- row 1 -->
    <text x="400" y="384" fill="#F6F2E8">主面板 Widget</text>
    <text x="400" y="406" font-size="11" fill="rgba(246,242,232,0.55)">三段流：今日 · 任务 · 倒计时</text>
    <rect x="1300" y="370" width="56" height="28" rx="14" fill="#D6A957"/>
    <circle cx="1342" cy="384" r="10" fill="#0a0a0a"/>

    <line x1="400" y1="446" x2="1356" y2="446" stroke="rgba(127,230,255,0.08)"/>

    <!-- row 2 -->
    <text x="400" y="490" fill="#F6F2E8">倒计时 Widget</text>
    <text x="400" y="512" font-size="11" fill="rgba(246,242,232,0.55)">下一项 + 距离今日结束 · 任务完成率</text>
    <rect x="1300" y="476" width="56" height="28" rx="14" fill="#D6A957"/>
    <circle cx="1342" cy="490" r="10" fill="#0a0a0a"/>

    <line x1="400" y1="552" x2="1356" y2="552" stroke="rgba(127,230,255,0.08)"/>

    <!-- row 3 -->
    <text x="400" y="596" fill="#F6F2E8">每日任务 Widget</text>
    <text x="400" y="618" font-size="11" fill="rgba(246,242,232,0.55)">未完成清单 · 滑动右滑标记完成</text>
    <rect x="1300" y="582" width="56" height="28" rx="14" fill="#D6A957"/>
    <circle cx="1342" cy="596" r="10" fill="#0a0a0a"/>

    <line x1="400" y1="658" x2="1356" y2="658" stroke="rgba(127,230,255,0.08)"/>

    <!-- row 4 -->
    <text x="400" y="702" fill="#F6F2E8">原则卡 Widget</text>
    <text x="400" y="724" font-size="11" fill="rgba(246,242,232,0.55)">38 张原则随机轮换 · 翻页 3D 动效</text>
    <rect x="1300" y="688" width="56" height="28" rx="14" fill="rgba(246,242,232,0.18)"/>
    <circle cx="1314" cy="702" r="10" fill="#0a0a0a"/>

    <line x1="400" y1="764" x2="1356" y2="764" stroke="rgba(127,230,255,0.08)"/>

    <!-- row 5 -->
    <text x="400" y="808" fill="#F6F2E8">备忘 Widget</text>
    <text x="400" y="830" font-size="11" fill="rgba(246,242,232,0.55)">钉在桌面的便笺 · 支持 Markdown</text>
    <rect x="1300" y="794" width="56" height="28" rx="14" fill="#D6A957"/>
    <circle cx="1342" cy="808" r="10" fill="#0a0a0a"/>
  </g>

  <!-- bottom bar -->
  <line x1="80" y1="930" x2="1520" y2="930" stroke="rgba(127,230,255,0.12)" stroke-width="1"/>
  <text x="80" y="966" font-size="10" letter-spacing="0.3em" fill="rgba(246,242,232,0.32)">⌘ , · LOCAL ONLY · NO CLOUD SYNC</text>
  <text x="1320" y="966" font-size="10" letter-spacing="0.3em" fill="rgba(214,169,87,0.7)">CHANGES SAVED · 14:23</text>
  <circle cx="1500" cy="962" r="3" fill="#D6A957"/>
</svg>
