<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace">
  <defs>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="0.18" stop-color="#ffefb8" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffba6f" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#ff7b39" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff7b39" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ritualBg" cx="50%" cy="55%" r="62%">
      <stop offset="0" stop-color="#0c1320"/>
      <stop offset="0.6" stop-color="#040711"/>
      <stop offset="1" stop-color="#02040b"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#ritualBg)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.5">
    <circle cx="120" cy="180" r="0.9"/>
    <circle cx="260" cy="120" r="0.7"/>
    <circle cx="420" cy="220" r="1.2"/>
    <circle cx="580" cy="90" r="0.7"/>
    <circle cx="780" cy="160" r="0.8"/>
    <circle cx="980" cy="220" r="1.1"/>
    <circle cx="1180" cy="130" r="0.7"/>
    <circle cx="1320" cy="210" r="0.9"/>
    <circle cx="1460" cy="100" r="0.8"/>
    <circle cx="80" cy="380" r="0.6"/>
    <circle cx="220" cy="460" r="0.8"/>
    <circle cx="1380" cy="380" r="0.7"/>
    <circle cx="1500" cy="470" r="1.0"/>
    <circle cx="140" cy="640" r="0.7"/>
    <circle cx="1480" cy="660" r="0.9"/>
  </g>

  <!-- rising star center -->
  <circle cx="800" cy="380" r="280" fill="url(#sunHalo)" opacity="0.75"/>
  <circle cx="800" cy="380" r="44" fill="#fff8dc"/>
  <circle cx="800" cy="380" r="18" fill="#fff"/>
  <!-- light cross spikes -->
  <g stroke="#fff8dc" stroke-width="1.5" opacity="0.45">
    <line x1="800" y1="180" x2="800" y2="580"/>
    <line x1="600" y1="380" x2="1000" y2="380"/>
  </g>
  <g stroke="#ffefb8" stroke-width="1" opacity="0.32">
    <line x1="660" y1="240" x2="940" y2="520"/>
    <line x1="940" y1="240" x2="660" y2="520"/>
  </g>

  <!-- shockwave rings -->
  <g fill="none" stroke="#ffefb8" stroke-width="1.2" opacity="0.18">
    <circle cx="800" cy="380" r="360"/>
    <circle cx="800" cy="380" r="480"/>
    <circle cx="800" cy="380" r="600"/>
  </g>

  <!-- hud top -->
  <text x="800" y="60" text-anchor="middle" font-size="12" letter-spacing="0.36em" fill="rgba(127,230,255,0.7)">[ RITUAL · 入场 · SUNRISE ]</text>
  <line x1="720" y1="80" x2="880" y2="80" stroke="#7FE6FF" stroke-width="1" opacity="0.5"/>

  <!-- main copy -->
  <text x="800" y="780" text-anchor="middle" font-size="84" letter-spacing="-0.02em" fill="#F6F2E8" font-weight="500">日出破晓</text>
  <text x="800" y="836" text-anchor="middle" font-size="16" letter-spacing="0.3em" fill="rgba(214,169,87,0.85)">BEGIN · TODAY</text>

  <!-- progress -->
  <line x1="540" y1="900" x2="1060" y2="900" stroke="rgba(127,230,255,0.18)" stroke-width="1.5"/>
  <line x1="540" y1="900" x2="850" y2="900" stroke="#D6A957" stroke-width="2"/>
  <circle cx="850" cy="900" r="4" fill="#D6A957"/>

  <!-- bottom hud -->
  <text x="80" y="966" font-size="10" letter-spacing="0.3em" fill="rgba(246,242,232,0.4)">RITUAL ENGINE · WEB AUDIO · 10.8s</text>
  <text x="1380" y="966" font-size="10" letter-spacing="0.3em" fill="rgba(214,169,87,0.7)">03 / 04 · SKIP →</text>
</svg>
